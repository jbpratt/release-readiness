name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Create frontend dist stub
        run: mkdir -p web/dist && touch web/dist/index.html

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9

      - name: Test
        run: go test ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Biome lint
        run: npx biome ci src/

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build
        run: npx vite build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Playwright (fixture mode)
        run: dev/e2e.sh

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-artifacts
          path: web/e2e-artifacts

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build container image
        run: docker build -f deploy/Containerfile -t release-readiness:pr-${{ github.event.pull_request.number || github.sha }} .
